<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ChatWave — real-time one-on-one and group chat with end-to-end encryption."
    />
    <meta name="theme-color" content="#0d9488" />
    <title>ChatWave</title>
    <script>
      // Apply the saved theme before first paint so the app never flashes the
      // wrong colors. useTheme() keeps localStorage and the attribute in sync.
      (function () {
        try {
          var theme = localStorage.getItem('chatwave.theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
